name: Crear APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Compilar Ignacio NutriApp
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar aplicación web
        run: npm run build
      - name: Crear proyecto Android con Capacitor
        run: npx cap add android
      - name: Sincronizar aplicación con Android
        run: npx cap sync android
      - name: Compilar APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ignacio-NutriApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
